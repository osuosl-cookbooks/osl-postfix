---
driver:
  name: vagrant

verifier:
  name: inspec

transport:
  name: rsync

provisioner:
  name: cinc_infra
  product_version: '18'
  enforce_idempotency: true
  multiple_converge: 2
  deprecations_as_errors: true
  data_bags_path: test/integration/data_bags
  encrypted_data_bag_secret_key_path: test/integration/encrypted_data_bag_secret
  attributes:
    osl-selinux:
      enforcing: true

platforms:
  - name: almalinux-8
  - name: almalinux-9
  - name: almalinux-10
  - name: debian-12
  - name: debian-13

suites:
  - name: default
    run_list:
      - recipe[postfix_test::default]
  - name: default-gateway
    run_list:
      - recipe[postfix_test::default_gateway]
    verifier:
      inspec_tests:
        - name: default-gateway
          path: test/integration/default-gateway
      controls:
        - postfix-common
        - postfix-default-gateway
  - name: server
    run_list:
      - recipe[postfix_test::server]
    verifier:
      inspec_tests:
        - name: default
          path: test/integration/default
        - name: server
          path: test/integration/server
      controls:
        - postfix-common
        - postfix-server
    excludes:
      - debian-12
      - debian-13
      - ubuntu-24.04
  - name: server-standalone
    run_list:
      - recipe[postfix_test::server_standalone]
    verifier:
      inspec_tests:
        - name: default
          path: test/integration/default
        - name: server
          path: test/integration/server
      controls:
        - postfix-common
        - postfix-server
    excludes:
      - debian-12
      - debian-13
      - ubuntu-24.04
  - name: server-ssl
    run_list:
      - recipe[postfix_test::server_ssl]
    verifier:
      inspec_tests:
        - name: default
          path: test/integration/default
        - name: server
          path: test/integration/server
        - name: server-ssl
          path: test/integration/server-ssl
        - name: osuosl-baseline
          git: https://github.com/osuosl/osuosl-baseline.git
      controls:
        - postfix-common
        - postfix-server
        - postfix-server-ssl
        - ssl-baseline
      inputs:
        smtpd_tls_security_level: 'may'
        ssl_port:
          - 465
    excludes:
      - debian-12
      - debian-13
      - ubuntu-24.04
